name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # full re-verification of every stored circuit (stdlib only)
      - run: python tools/verify_atlas.py
      # lookup smoke: canonical class, a transformed table, capped regime,
      # constructive form — each re-verifies its output before printing.
      # Both circuit models are exercised; --regime and --constructive are
      # layered-model tables and must be asked for as such.
      - run: python tools/atlas_lookup.py 0x6996
      - run: python tools/atlas_lookup.py 0xbee7
      - run: python tools/atlas_lookup.py 0x0ff0
      - run: python tools/atlas_lookup.py 0x6996 --model layered
      - run: python tools/atlas_lookup.py 0x0110 --model layered --regime w1 --metric wire_primary
      - run: python tools/atlas_lookup.py 0x6996 --model layered --constructive
      # depth-3 skip circuits are the ONLY place the source convention is
      # observable (an output gate reading both hidden gates, width 2+4).
      # 0x9669 is parity-4 transformed, so it exercises the decode AND the
      # NPN transform-back on such a gate.
      - run: python tools/atlas_lookup.py 0x9669
      - run: python tools/atlas_lookup.py 0x1be4
